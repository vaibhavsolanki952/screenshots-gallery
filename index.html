<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshots – Today</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 24px 32px 16px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #meta {
      font-size: 0.8rem;
      color: #666;
    }

    #actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #181818;
      color: #cfcfcf;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn:hover {
      border-color: #444;
      color: #fff;
    }

    #bookmark-bar {
      display: none;
      padding: 10px 32px;
      border-bottom: 1px solid #1e1e1e;
      background: #121212;
      color: #8bb8ff;
      font-size: 0.8rem;
    }

    #status {
      padding: 60px 32px;
      text-align: center;
      color: #555;
      font-size: 0.9rem;
    }

    #grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      background: #111;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .card .timestamp {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 10px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      font-size: 0.72rem;
      color: #ccc;
      letter-spacing: 0.04em;
      opacity: 0;
    }

    .card:hover .timestamp { opacity: 1; }

    .screenshot-group {
      margin-top: 8px;
      border: 1px solid #29466e;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
    }

    .screenshot-group summary {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 14px;
      color: #b9d4ff;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      list-style: none;
      user-select: none;
    }

    .screenshot-group summary::-webkit-details-marker { display: none; }
    .screenshot-group summary::before {
      content: "›";
      color: #8bb8ff;
      font-size: 1.25rem;
      transition: transform 150ms ease;
    }
    .screenshot-group[open] summary::before { transform: rotate(90deg); }
    .screenshot-group summary:hover { background: #172238; }

    .group-count {
      margin-left: auto;
      color: #7f95b5;
      font-size: 0.74rem;
      font-weight: 500;
    }

    .group-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 6px 6px;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 95vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
    }

    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 22px;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    #lightbox-close:hover { color: #fff; }

    #lightbox-label {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<header>
  <h1>Screenshots</h1>
  <span id="meta">loading…</span>
  <div id="actions">
    <button id="bookmark-btn" class="btn" type="button">New Group</button>
    <button id="clear-bookmark-btn" class="btn" type="button">Clear Groups</button>
  </div>
</header>

<div id="bookmark-bar"></div>
<div id="status">Fetching today's screenshots…</div>
<div id="grid"></div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" />
  <span id="lightbox-label"></span>
</div>

<script>
  const CDN    = "https://d3efr8i3xj2spn.cloudfront.net";
  const POLL_MS = 1000;

  // Use UTC because uploads are partitioned by UTC date in sender.py.
  const today  = new Date().toISOString().slice(0, 10);
  // Must match S3_PREFIX in .env (sender.py writes <prefix><date>/_manifest.json).
  const S3_PREFIX = "ct/screenshots/";
  const REMOTE_MANIFEST_URL = `${CDN}/${S3_PREFIX}${today}/_manifest.json`;
  const BOOKMARK_STORAGE_KEY = `gallery-bookmark:${today}`;
  const GROUPS_STORAGE_KEY = `gallery-groups:${today}`;

  document.querySelector("header h1").textContent = `Screenshots — ${today}`;

  const seenKeys = new Set();
  let legacyBookmarkKey = localStorage.getItem(BOOKMARK_STORAGE_KEY) || "";
  let groups = loadGroups();

  function loadGroups() {
    try {
      const saved = JSON.parse(localStorage.getItem(GROUPS_STORAGE_KEY) || "[]");
      if (!Array.isArray(saved)) return [];
      return saved
        .filter(group => group && typeof group.id === "string" && Array.isArray(group.keys))
        .map(group => ({
          id: group.id,
          label: typeof group.label === "string" ? group.label : "Screenshot group",
          keys: group.keys.filter(key => typeof key === "string"),
          open: Boolean(group.open),
        }));
    } catch {
      return [];
    }
  }

  function saveGroups() {
    localStorage.setItem(GROUPS_STORAGE_KEY, JSON.stringify(groups));
  }

  async function fetchManifestKeys(url) {
    const res = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
    // CloudFront returns 403 (rather than 404) for a manifest that does not
    // exist yet. Both mean there are no screenshots for today.
    if (res.status === 404 || res.status === 403) return [];
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data.keys)) throw new Error("Invalid manifest");
    return data.keys.filter(k => typeof k === "string" && /\.(png|jpe?g|webp)$/i.test(k));
  }

  async function fetchKeys() {
    return fetchManifestKeys(REMOTE_MANIFEST_URL);
  }

  function formatKey(key) {
    const name = key.split("/").pop();
    const raw  = name.replace(/\.\w+$/, "").split("-")[0]; // "153045"
    return /^\d{6}$/.test(raw)
      ? `${raw.slice(0,2)}:${raw.slice(2,4)}:${raw.slice(4,6)}`
      : name;
  }

  function addCard(key, prepend = false) {
    const label = formatKey(key);
    const card  = document.createElement("div");
    card.className  = "card";
    card.dataset.key = key;

    const img = document.createElement("img");
    img.src     = `${CDN}/${key}`;
    img.alt     = label;
    img.loading = "lazy";

    const ts = document.createElement("div");
    ts.className   = "timestamp";
    ts.textContent = label;

    card.append(img, ts);
    card.addEventListener("click", () => openLightbox(`${CDN}/${key}`, label));

    const grid = document.getElementById("grid");
    if (prepend && grid.firstChild) {
      grid.insertBefore(card, grid.firstChild);
      // Flash new card
      card.style.outline = "2px solid #4af";
      setTimeout(() => card.style.outline = "", 2500);
    } else {
      grid.appendChild(card);
    }
  }

  function createGroupElement(group, cardsByKey) {
    const details = document.createElement("details");
    details.className = "screenshot-group";
    details.open = group.open;

    const summary = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = group.label;
    const count = document.createElement("span");
    count.className = "group-count";
    count.textContent = `${group.keys.length} screenshot${group.keys.length !== 1 ? "s" : ""}`;
    summary.append(label, count);

    const content = document.createElement("div");
    content.className = "group-content";
    group.keys.forEach(key => {
      const card = cardsByKey.get(key);
      if (card) content.append(card);
    });

    details.append(summary, content);
    details.addEventListener("toggle", () => {
      group.open = details.open;
      saveGroups();
    });
    return details;
  }

  function applyGroups() {
    const bar = document.getElementById("bookmark-bar");
    const grid = document.getElementById("grid");
    const cards = [...document.querySelectorAll(".card")];
    const cardsByKey = new Map(cards.map(card => [card.dataset.key, card]));
    const groupedKeys = new Set(groups.flatMap(group => group.keys));

    grid.replaceChildren();
    cards.filter(card => !groupedKeys.has(card.dataset.key)).forEach(card => grid.append(card));
    groups.forEach(group => grid.append(createGroupElement(group, cardsByKey)));

    bar.style.display = groups.length ? "block" : "none";
    bar.textContent = groups.length
      ? `${groups.length} saved group${groups.length !== 1 ? "s" : ""}. New screenshots stay on top.`
      : "";
  }

  function migrateLegacyBookmark() {
    if (!legacyBookmarkKey || groups.length || !seenKeys.size) return;
    const keys = [...document.querySelectorAll(".card")]
      .filter(card => card.dataset.key.localeCompare(legacyBookmarkKey) <= 0)
      .map(card => card.dataset.key);
    if (keys.length) {
      groups = [{ id: `legacy-${legacyBookmarkKey}`, label: "Earlier screenshots", keys, open: false }];
      saveGroups();
    }
    legacyBookmarkKey = "";
    localStorage.removeItem(BOOKMARK_STORAGE_KEY);
  }

  function setBookmarkToCurrentTop() {
    const keys = [...document.querySelectorAll("#grid > .card")].map(card => card.dataset.key);
    if (!keys.length) return;
    groups.unshift({
      id: `group-${Date.now()}`,
      label: `Screenshot group · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`,
      keys,
      open: false,
    });
    saveGroups();
    applyGroups();
  }

  function clearBookmark() {
    groups = [];
    localStorage.removeItem(GROUPS_STORAGE_KEY);
    applyGroups();
  }

  async function poll(isFirst = false) {
    const statusEl = document.getElementById("status");
    const metaEl   = document.getElementById("meta");

    try {
      const keys = await fetchKeys();

      // Sort descending (latest first by filename)
      keys.sort((a, b) => b.localeCompare(a));

      const newKeys = keys.filter(k => !seenKeys.has(k));

      if (isFirst) {
        if (keys.length === 0) {
          statusEl.textContent = "No screenshots yet today.";
        } else {
          statusEl.style.display = "none";
          keys.forEach(k => { seenKeys.add(k); addCard(k, false); });
        }
      } else {
        // Prepend genuinely new ones (sorted so latest goes first)
        newKeys.sort((a, b) => b.localeCompare(a)).forEach(k => {
          seenKeys.add(k);
          addCard(k, true);
          statusEl.style.display = "none";
        });
      }

      const total = seenKeys.size;
      metaEl.textContent = total
        ? `${total} screenshot${total !== 1 ? "s" : ""} · live`
        : "watching…";
      migrateLegacyBookmark();
      applyGroups();

    } catch (err) {
      if (isFirst) statusEl.textContent = `Error: ${err.message}`;
      metaEl.textContent = "retrying…";
    }

    setTimeout(() => poll(false), POLL_MS);
  }

  /* ── Lightbox ── */
  function openLightbox(src, label) {
    document.getElementById("lightbox-img").src   = src;
    document.getElementById("lightbox-label").textContent = label;
    document.getElementById("lightbox").classList.add("open");
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    document.getElementById("lightbox-img").src = "";
  }

  document.getElementById("lightbox").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeLightbox();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
  document.getElementById("bookmark-btn").addEventListener("click", setBookmarkToCurrentTop);
  document.getElementById("clear-bookmark-btn").addEventListener("click", clearBookmark);

  poll(true);
</script>
</body>
</html>
